name: Generate Snake

on:
  schedule:
    # Toutes les 12 heures
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Generate the snake files in './dist/'
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Les cartes de stats lisent aussi les repos privés grâce au jeton METRICS_TOKEN (lecture seule)
      - name: Generate the stats card
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-stats.svg
          output_action: none
          config_timezone: Europe/Paris
          base: header, activity, repositories
          repositories_affiliations: owner, collaborator

      - name: Generate the languages card
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          output_action: none
          base: ""
          repositories_affiliations: owner, collaborator
          plugin_languages: yes
          plugin_languages_ignored: mql5
          plugin_languages_limit: 8
          plugin_languages_details: percentage

      - name: Copy the stats cards to './dist/'
        run: sudo cp /metrics_renders/metrics-*.svg dist/ || echo "Pas de cartes de stats générées"

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update snake animations and stats cards [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}